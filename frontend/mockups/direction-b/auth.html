<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlgoLearn · Log in or sign up · B</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/auth.css">
  <script defer src="../shared/interact.js"></script>
  <script defer src="../shared/motion.js"></script>
</head>
<body>
  <header class="bug">
    <div class="wrap">
      <a class="wordmark" href="landing.html">Algo<span>Learn</span></a>
      <nav aria-label="Main"></nav>
      <div class="bug-meta"><button class="btn btn-text" data-theme-toggle type="button">Theme</button></div>
    </div>
  </header>

  <main class="auth wrap">
    <aside class="auth-side" aria-hidden="true">
      <p class="fig side-num">630</p>
      <p class="side-copy">topic pairs scored from your own submissions.</p>
    </aside>

    <section class="auth-panel" aria-labelledby="auth-title">
      <h1 id="auth-title" class="sr-only">Log in or sign up</h1>
      <div class="segments" role="tablist" aria-label="Account">
        <button role="tab" id="tab-login" aria-selected="true" aria-controls="panel-login">Log in</button>
        <button role="tab" id="tab-signup" aria-selected="false" aria-controls="panel-signup" tabindex="-1">Sign up</button>
      </div>

      <form id="panel-login" role="tabpanel" aria-labelledby="tab-login">
        <div class="field"><label for="le">Email</label><input class="input" id="le" type="email" autocomplete="email" value="ananya.k@example.in"></div>
        <div class="field">
          <label for="lp">Password</label>
          <input class="input" id="lp" type="password" autocomplete="current-password" aria-invalid="true" aria-describedby="lp-err" value="wrongpass">
          <p class="field-error" id="lp-err">That email and password don't match. Check both and try again.</p>
        </div>
        <button class="btn btn-plate btn-wide" type="button">Log in</button>
      </form>

      <form id="panel-signup" role="tabpanel" aria-labelledby="tab-signup" hidden>
        <div class="field"><label for="se">Email</label><input class="input" id="se" type="email" autocomplete="email"></div>
        <div class="field"><label for="sp">Password · 8+ characters</label><input class="input" id="sp" type="password" autocomplete="new-password"></div>
        <div class="field"><label for="sh">Codeforces handle · optional</label><input class="input" id="sh" autocomplete="off" placeholder="e.g. ananya_k"></div>
        <button class="btn btn-plate btn-wide" type="button">Create account</button>
      </form>
      <p class="small muted">For practice and upsolving. Please don't use AlgoLearn during live rated contests or placement tests.</p>
    </section>
  </main>
</body>
</html>
