# Serves the built SPA and proxies the API (docker compose: the backend service on port 4000).
# Same headers and caching as frontend/vercel.json.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # POST /stuck uploads: 5 MB file + form fields (the backend refuses anything larger with JSON errors).
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The stuck flow promises an answer within 55 s.
        proxy_read_timeout 70s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
