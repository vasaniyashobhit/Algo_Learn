# AlgoLearn API. Values come from the environment (backend/.env is loaded in dev by spring-dotenv).
# Every variable is validated at startup by com.algolearn.config.env.EnvValidator.
server:
  port: ${PORT:4000}
  shutdown: graceful
  # POST /stuck uploads: our own checks (10 fields, 1 file) must fire before Tomcat's part limit, and a refused
  # upload is drained so the client still receives the 413 JSON.
  tomcat:
    max-part-count: 20
    max-swallow-size: 10MB
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: algolearn
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 7MB
  web:
    resources:
      add-mappings: false
  mvc:
    problemdetails:
      enabled: false

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        exclude: "*"

logging:
  level:
    root: ${LOG_LEVEL:info}
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: off
    # Task summaries (--task=...) always print, whatever LOG_LEVEL is.
    algolearn.task.summary: info

algolearn:
  rate-limit:
    global:
      limit: 300
      window: 15m
