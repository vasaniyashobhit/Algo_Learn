# E2E test backend (E2eApplication, profiles e2e + prod): fixed values for every variable, like the legacy e2e
# server; real environment variables (CLIENT_URL, LOG_LEVEL) still win. The database is the Testcontainers
# PostgreSQL from E2eConfig (@ServiceConnection overrides DATABASE_URL).
DATABASE_URL: jdbc:postgresql://localhost:5432/unused
DATABASE_USERNAME: e2e
DATABASE_PASSWORD: e2e
JWT_SECRET: e2e-jwt-secret-that-is-long-enough-0123456789
JWT_EXPIRES_IN: 1h
CLIENT_URL: http://localhost:5174
GEMINI_API_KEY: e2e-fake-key-never-used
GEMINI_MODELS: e2e-unused
CRON_SECRET: e2e-cron-secret-0123456789
LOG_LEVEL: warn

server:
  port: ${E2E_API_PORT:4100}

# Relaxed limits (legacy RELAXED: 10,000 per minute) so parallel tests never hit them.
algolearn:
  rate-limit:
    global:
      limit: 10000
      window: 1m
    auth:
      limit: 10000
      window: 1m
    stuck:
      limit: 10000
      window: 1m
  # The legacy E2E server used createApp (no in-process cron) and the fake client (no 2.1 s spacing).
  jobs:
    scheduler-enabled: false
  codeforces:
    min-interval-ms: 0
