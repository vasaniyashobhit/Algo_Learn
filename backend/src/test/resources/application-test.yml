# Test profile: fixed, valid values for every variable. The database comes from Testcontainers
# (@ServiceConnection overrides DATABASE_URL). Generous rate limit, like the legacy test app.
DATABASE_URL: jdbc:postgresql://localhost:5432/unused
DATABASE_USERNAME: test
DATABASE_PASSWORD: test
JWT_SECRET: tttttttttttttttttttttttttttttttt
JWT_EXPIRES_IN: 1h
CLIENT_URL: http://localhost:5173
GEMINI_API_KEY: test-gemini-key
GEMINI_MODELS: gemini-a, gemini-b
CRON_SECRET: cron-secret-for-tests
LOG_LEVEL: warn

algolearn:
  auth:
    hash-rounds: 4
  rate-limit:
    global:
      limit: 1000
      window: 1m
    auth:
      limit: 1000
      window: 1m
    stuck:
      limit: 1000
      window: 1m
  # No in-process cron, no background job threads, no 2.1 s Codeforces spacing in tests.
  jobs:
    scheduler-enabled: false
    background-enabled: false
  codeforces:
    min-interval-ms: 0
